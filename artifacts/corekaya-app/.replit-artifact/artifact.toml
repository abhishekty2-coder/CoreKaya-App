kind = "web"
previewPath = "/"
title = "CoreKaya Pilates Labs"
version = "1.0.0"
id = "artifacts/corekaya-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18822

[services.development]
run = "pnpm --filter @workspace/corekaya-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/corekaya-app", "run", "build" ]
publicDir = "artifacts/corekaya-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18822"
BASE_PATH = "/"
